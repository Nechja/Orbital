name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            binary: OrbitalDocking
          - os: windows-latest
            rid: win-x64
            binary: OrbitalDocking.exe

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore Orbital.slnx

    - name: Build
      run: dotnet build Orbital.slnx --configuration Release --no-restore

    - name: Test
      run: dotnet test Orbital.slnx --no-build --verbosity normal --configuration Release

    - name: Verify single-file publish
      shell: bash
      run: |
        dotnet publish OrbitalDocking.csproj -c Release -r ${{ matrix.rid }} \
          --self-contained true \
          -p:PublishSingleFile=true \
          -p:IncludeNativeLibrariesForSelfExtract=true \
          -p:DebugType=none \
          -p:DebugSymbols=false \
          -o ./test-publish

        test -f ./test-publish/${{ matrix.binary }}
        echo "Single-file publish successful"
